<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AK Real Estate — Listing</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ak-black: #050505;
      --ak-ink: #0a0a0a;
      --ak-charcoal: #111111;
      --ak-graphite: #1b1b1b;
      --ak-crimson: #b0181c;
      --fg: #f5f1ea;
      --fg-2: rgba(245, 241, 234, .72);
      --fg-3: rgba(245, 241, 234, .45);
      --hairline: rgba(245, 241, 234, .14);
      --font-display: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --font-body: Inter, Arial, sans-serif;
      --gutter: clamp(20px, 5vw, 72px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--ak-black);
      color: var(--fg);
      font-family: var(--font-body);
    }

    a { color: inherit; }

    .shell {
      min-height: 100vh;
      background:
        radial-gradient(circle at 70% 20%, rgba(176,24,28,.10), transparent 32%),
        linear-gradient(180deg, #080808 0%, #050505 100%);
    }

    header {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--hairline);
      position: sticky;
      top: 0;
      background: rgba(5,5,5,.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 50;
    }

    .logo {
      font-family: var(--font-display);
      letter-spacing: .18em;
      font-size: 22px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      white-space: nowrap;
    }

    .red-square {
      width: 7px;
      height: 7px;
      background: var(--ak-crimson);
      display: inline-block;
      flex: 0 0 auto;
    }

    .header-nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.4vw, 36px);
    }

    .header-nav a {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--fg-2);
      text-decoration: none;
      transition: color .28s;
      position: relative;
      padding-bottom: 4px;
    }

    .header-nav a:hover { color: var(--fg); }

    .header-cta {
      padding: 10px 18px;
      background: var(--ak-crimson);
      color: #fff;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-decoration: none;
      flex-shrink: 0;
      white-space: nowrap;
      transition: background .2s;
    }

    .header-cta:hover { background: #8a1013; color: #fff; }

    .lang-switch { display: flex; align-items: center; gap: 4px; }

    .lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--fg-3);
      padding: 2px 0;
      transition: color .2s;
    }

    .lang-btn:hover { color: var(--fg-2); }
    .lang-btn.active { color: var(--fg); }
    .lang-sep { color: var(--fg-3); font-size: 10px; letter-spacing: 0; }

    .hamburger-btn {
      display: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      color: var(--fg);
      flex-direction: column;
      gap: 5px;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      flex-shrink: 0;
      padding: 0;
    }

    .hamburger-btn .bar {
      width: 22px;
      height: 1px;
      background: currentColor;
      transition: transform .3s, opacity .2s;
    }

    .hamburger-btn.open .bar:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .hamburger-btn.open .bar:nth-child(2) { opacity: 0; }
    .hamburger-btn.open .bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .mobile-sheet {
      position: fixed;
      inset: 0;
      z-index: 49;
      background: rgba(0,0,0,.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 90px clamp(20px, 5vw, 72px) 40px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity .4s, transform .4s;
      overflow-y: auto;
    }

    .mobile-sheet.open { opacity: 1; pointer-events: auto; transform: none; }

    .mobile-sheet-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--hairline);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--fg-2);
    }

    .mobile-nav-links { display: flex; flex-direction: column; gap: 4px; }

    .mobile-nav-links a {
      display: flex;
      align-items: baseline;
      gap: 16px;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: clamp(34px, 9vw, 56px);
      line-height: 1.1;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--fg);
      padding: 10px 0;
      border-bottom: 1px solid var(--hairline);
    }

    .mobile-nav-links a.cta { color: var(--ak-crimson); }

    .mobile-nav-links .num {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .28em;
      color: var(--fg-3);
      min-width: 28px;
    }

    .mobile-nav-links a.cta .num { color: var(--ak-crimson); }

    .mobile-sheet-foot {
      margin-top: auto;
      padding-top: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--fg-3);
      padding: 2px 0;
      transition: color .2s;
    }

    .mobile-lang-btn.active { color: var(--fg); }
    .mobile-lang-btn:hover { color: var(--fg-2); }

    @media (max-width: 768px) {
      .header-nav { display: none; }
      .hamburger-btn { display: flex; }
    }

    main {
      padding: clamp(28px, 5vw, 76px);
    }

    .loading,
    .not-found {
      min-height: calc(100vh - 82px);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--fg-2);
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr);
      gap: clamp(28px, 5vw, 72px);
      align-items: start;
    }

    .gallery {
      display: grid;
      gap: 16px;
    }

    .main-image {
      position: relative;
      aspect-ratio: 16 / 10;
      background: var(--ak-graphite);
      border: 1px solid var(--hairline);
      overflow: hidden;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(.92) contrast(1.04);
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .thumb {
      aspect-ratio: 4 / 3;
      border: 1px solid var(--hairline);
      overflow: hidden;
      background: var(--ak-graphite);
      cursor: pointer;
      opacity: .72;
    }

    .thumb.active {
      border-color: var(--ak-crimson);
      opacity: 1;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .details {
      position: sticky;
      top: 110px;
      border: 1px solid var(--hairline);
      background: rgba(17,17,17,.72);
      padding: clamp(24px, 3vw, 42px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--fg-2);
      font-size: 10px;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(44px, 6vw, 86px);
      line-height: .92;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .price {
      margin-top: 28px;
      font-family: var(--font-display);
      font-size: clamp(30px, 3vw, 44px);
      letter-spacing: .05em;
    }

    .meta {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--hairline);
      border: 1px solid var(--hairline);
    }

    .meta div {
      background: var(--ak-black);
      padding: 16px 14px;
    }

    .meta span {
      display: block;
      color: var(--fg-3);
      font-size: 9px;
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .meta strong {
      font-weight: 400;
      font-size: 15px;
    }

    .description {
      margin-top: 30px;
      color: var(--fg-2);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 300;
    }

    .features {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--hairline);
      color: var(--fg-2);
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: .04em;
    }

    .actions {
      margin-top: 34px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      border: 1px solid var(--hairline);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .btn.primary {
      background: var(--ak-crimson);
      border-color: var(--ak-crimson);
      color: white;
    }

    .btn.secondary {
      color: var(--fg-2);
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    @media (max-width: 920px) {
  body {
    overflow-x: hidden;
  }

  .logo {
    font-size: 18px;
    letter-spacing: .14em;
  }

  main {
    padding: 22px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .details {
    position: relative;
    top: auto;
    padding: 24px;
  }

  .main-image {
    aspect-ratio: 4 / 3;
  }

  .thumbs {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  h1 {
    font-size: clamp(38px, 11vw, 64px);
    line-height: .92;
    letter-spacing: .03em;
    word-break: break-word;
  }

  .price {
    font-size: 34px;
  }

  .meta {
    grid-template-columns: 1fr;
  }

  .description {
    font-size: 14px;
    line-height: 1.7;
  }

  .actions {
    flex-direction: column;
  }

  .btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  main {
    padding: 18px 14px 36px;
  }

  .logo {
    font-size: 16px;
  }

  .details {
    padding: 20px 16px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: .24em;
  }

  h1 {
    font-size: clamp(28px, 10vw, 48px);
    letter-spacing: .02em;
  }

  .price {
    font-size: 30px;
  }

  .thumbs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .meta div {
    padding: 14px 12px;
  }
}
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <a class="logo" href="/">
        AK <span class="red-square"></span> Real Estate
      </a>
      <nav class="header-nav">
        <a href="/listings">Обяви</a>
        <a href="/services">Услуги</a>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="bg" type="button">BG</button>
          <span class="lang-sep">/</span>
          <button class="lang-btn" data-lang="en" type="button">EN</button>
        </div>
        <a href="mailto:office@akrealestatebg.com" class="header-cta">Свържи се с нас</a>
      </nav>
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" type="button">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

    <div class="mobile-sheet" id="mobile-sheet">
      <div class="mobile-sheet-head">
        <span style="width:6px;height:6px;background:var(--ak-crimson);display:inline-block;flex-shrink:0;"></span>
        Navigation
      </div>
      <div class="mobile-nav-links">
        <a href="/listings">
          <span class="num">01</span><span>Обяви</span>
        </a>
        <a href="/services">
          <span class="num">02</span><span>Услуги</span>
        </a>
        <a href="mailto:office@akrealestatebg.com" class="cta">
          <span class="num">03</span><span>Свържи се с нас</span>
        </a>
      </div>
      <div class="mobile-sheet-foot">
        <button class="mobile-lang-btn active" data-lang="bg" type="button">BG</button>
        <span style="color:var(--fg-3);font-size:10px;">/</span>
        <button class="mobile-lang-btn" data-lang="en" type="button">EN</button>
      </div>
    </div>

    <main id="app">
      <div class="loading">Loading listing…</div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://ylyilqwoiyirodigshgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wxCfqS0aCFRRXf0WgIhGzw_2SGd8tcL";

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const app = document.getElementById("app");

    function formatPrice(n, currency = "EUR", listingType) {
      if (n == null || isNaN(Number(n))) return "—";
      const sym = currency === "USD" ? "$" : currency === "EUR" ? "€" : currency === "GBP" ? "£" : currency + " ";
      let value = Number(n);
      let formatted;
      if (value >= 1000000) formatted = sym + (value / 1000000).toFixed(value % 1000000 === 0 ? 0 : 1) + "M";
      else if (value >= 1000) formatted = sym + value.toLocaleString();
      else formatted = sym + value;
      if (listingType === "Rent") formatted += "/mo";
      return formatted;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getImageUrl(image) {
      if (!image) return '';
      let raw = typeof image === 'string' ? image
        : (image.url || image.publicUrl || image.public_url || image.image_url || image.src || image.path || '');
      if (!raw) return '';
      if (raw.startsWith('blob:') || raw.startsWith('data:')) return raw;
      if (raw.startsWith('http')) return raw;
      const base = SUPABASE_URL.replace(/\/$/, '');
      if (raw.includes('/storage/v1/object/public/')) return base + raw.substring(raw.indexOf('/storage/v1/object/public/'));
      if (raw.includes('/')) return base + '/storage/v1/object/public/' + raw;
      return base + '/storage/v1/object/public/listing-images/' + raw;
    }

    function translateStatus(status) {
  const map = {
    Active: "Активен",
    Sold: "Продаден",
    Rented: "Отдаден",
    Draft: "Чернова"
  };

  return escapeHtml(map[status] || status || "—");
}

function translateListingType(type) {
  const map = {
    Sale: "Продажба",
    Rent: "Наем"
  };

  return escapeHtml(map[type] || type || "—");
}

function translatePropertyType(type) {
  const map = {
    Apartment: "Апартамент",
    House: "Къща",
    Villa: "Вила",
    Office: "Офис",
    Land: "Парцел"
  };

  return escapeHtml(map[type] || type || "—");
}

    function renderNotFound() {
      app.innerHTML = `
        <div class="not-found">
          <div>
            <div class="eyebrow" style="justify-content:center;"><span class="red-square"></span> Listing</div>
            <h1 style="font-size:clamp(42px,8vw,92px);">Not found.</h1>
            <p style="letter-spacing:.08em;text-transform:none;line-height:1.7;margin-top:20px;">
              Обявата не е намерена или вече не е активна.
            </p>
            <div class="actions" style="justify-content:center;">
              <a class="btn primary" href="/">Към началото</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderListing(listing) {
      const images = Array.isArray(listing.images) ? listing.images : [];
      const mainIndex = Number(listing.main_image || 0);
      const mainImage = getImageUrl(images[mainIndex] || images[0] || "");

      app.innerHTML = `
        <div class="grid">
          <section class="gallery">
            <div class="main-image">
              ${mainImage ? `<img id="mainPhoto" src="${escapeHtml(mainImage)}" alt="">` : ""}
            </div>

            ${images.length > 1 ? `
              <div class="thumbs">
                ${images.map((src, index) => `
                  <button class="thumb ${index === mainIndex ? "active" : ""}" data-src="${escapeHtml(getImageUrl(src))}" type="button">
                    <img src="${escapeHtml(getImageUrl(src))}" alt="">
                  </button>
                `).join("")}
              </div>
            ` : ""}
          </section>

          <aside class="details">
            <div class="eyebrow">
              <span class="red-square"></span>
              ${escapeHtml(listing.area || listing.city || "Property")}
            </div>

            <h1>${escapeHtml(listing.title)}</h1>

            <div class="price">
              ${formatPrice(listing.price, listing.currency, listing.listing_type)}
            </div>

            <div class="meta">
            <div><span>Спални</span><strong>${escapeHtml(listing.bedrooms || "—")}</strong></div>
            <div><span>Бани</span><strong>${escapeHtml(listing.bathrooms || "—")}</strong></div>
            <div><span>Площ</span><strong>${escapeHtml(listing.area_sqm || "—")} m²</strong></div>
            <div><span>Тип имот</span><strong>${translatePropertyType(listing.property_type)}</strong></div>
            <div><span>Сделка</span><strong>${translateListingType(listing.listing_type)}</strong></div>
            <div><span>Статус</span><strong>${translateStatus(listing.status)}</strong></div>
            </div>

            ${listing.description ? `<div class="description">${escapeHtml(listing.description)}</div>` : ""}

            ${listing.features ? `<div class="features">${escapeHtml(listing.features)}</div>` : ""}

            <div class="actions">
              <a class="btn primary" href="/#contact">Заявете достъп</a>
              <a class="btn secondary" href="/">Назад</a>
            </div>
          </aside>
        </div>
      `;

      document.querySelectorAll(".thumb").forEach(btn => {
        btn.addEventListener("click", () => {
          const photo = document.getElementById("mainPhoto");
          if (photo) photo.src = btn.dataset.src;
          document.querySelectorAll(".thumb").forEach(x => x.classList.remove("active"));
          btn.classList.add("active");
        });
      });
    }

    async function loadListing() {
      if (!id) {
        renderNotFound();
        return;
      }

      const { data, error } = await client
        .from("listings")
        .select("*")
        .eq("id", id)
        .neq("status", "Draft")
        .single();

      if (error || !data) {
        console.error("Listing load error:", error);
        renderNotFound();
        return;
      }

      renderListing(data);
    }

    loadListing();
  </script>

  <script>
  (function(){
    var btn = document.getElementById('hamburger-btn');
    var sheet = document.getElementById('mobile-sheet');
    btn.addEventListener('click', function(){
      var isOpen = sheet.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && sheet.classList.contains('open')){
        sheet.classList.remove('open');
        btn.classList.remove('open');
        document.body.style.overflow = '';
      }
    });
    var allLang = Array.from(document.querySelectorAll('.lang-btn, .mobile-lang-btn'));
    function setLang(l){
      allLang.forEach(function(b){ b.classList.toggle('active', b.dataset.lang === l); });
      try { localStorage.setItem('ak-lang', l); } catch(e){}
    }
    allLang.forEach(function(b){
      b.addEventListener('click', function(){ setLang(b.dataset.lang); });
    });
    try { setLang(localStorage.getItem('ak-lang') || 'bg'); } catch(e){ setLang('bg'); }
  })();
  </script>
</body>
</html>

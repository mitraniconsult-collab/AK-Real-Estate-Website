<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#1c1c1c;padding:24px;min-height:200px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.swatch{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#f5f1ea;font-size:10px;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(255,255,255,.04)}
.hex{font-size:9px;letter-spacing:.12em;color:#9a9590;margin-top:2px}
.swatch.invert{color:#0a0a0a}
.swatch.invert .hex{color:#5a5550}
</style></head><body>
<div class="grid">
  <div class="swatch" style="background:#000000">Black<div class="hex">#000000</div></div>
  <div class="swatch" style="background:#0a0a0a">Ink<div class="hex">#0a0a0a</div></div>
  <div class="swatch" style="background:#141414">Charcoal<div class="hex">#141414</div></div>
  <div class="swatch" style="background:#1c1c1c">Graphite<div class="hex">#1c1c1c</div></div>
  <div class="swatch" style="background:#2a2a2a">Smoke<div class="hex">#2a2a2a</div></div>
  <div class="swatch" style="background:#3a3a3a">Iron<div class="hex">#3a3a3a</div></div>
</div>
</body></html>

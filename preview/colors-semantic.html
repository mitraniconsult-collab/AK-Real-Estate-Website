<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;color:#f5f1ea;padding:28px 32px;min-height:200px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:18px;padding:10px 0;border-top:1px solid #2a2a2a}
.row:first-of-type{border:0}
.tok{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#b0181c;min-width:140px}
.role{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#f5f1ea;flex:1}
.sw{width:64px;height:24px;border:1px solid rgba(255,255,255,.08)}
.val{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a5550;min-width:80px;text-align:right}
</style></head><body>
<div class="row"><div class="tok">--bg</div><div class="role">Default page background</div><div class="sw" style="background:#0a0a0a"></div><div class="val">#0A0A0A</div></div>
<div class="row"><div class="tok">--bg-alt</div><div class="role">Light editorial section</div><div class="sw" style="background:#f5f1ea"></div><div class="val">#F5F1EA</div></div>
<div class="row"><div class="tok">--surface</div><div class="role">Card surface on dark</div><div class="sw" style="background:#141414"></div><div class="val">#141414</div></div>
<div class="row"><div class="tok">--fg</div><div class="role">Primary text on dark</div><div class="sw" style="background:#ffffff"></div><div class="val">#FFFFFF</div></div>
<div class="row"><div class="tok">--fg-2</div><div class="role">Muted text · captions</div><div class="sw" style="background:#9a9590"></div><div class="val">#9A9590</div></div>
<div class="row"><div class="tok">--accent</div><div class="role">Accent · CTAs · marks</div><div class="sw" style="background:#b0181c"></div><div class="val">#B0181C</div></div>
<div class="row"><div class="tok">--hairline</div><div class="role">Divider line on dark</div><div class="sw" style="background:#2a2a2a"></div><div class="val">#2A2A2A</div></div>
</body></html>

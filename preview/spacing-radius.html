<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;color:#f5f1ea;padding:28px 32px;min-height:180px;display:flex;gap:36px;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.sw{width:80px;height:80px;background:#141414;border:1px solid #2a2a2a}
.tok{font-family:'JetBrains Mono',monospace;font-size:10px;color:#b0181c}
.lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#9a9590}
.val{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5a5550}
</style></head><body>
<div class="col"><div class="sw" style="border-radius:0"></div><div class="lbl">Buttons · Inputs</div><div class="tok">--r-0</div><div class="val">0px</div></div>
<div class="col"><div class="sw" style="border-radius:2px"></div><div class="lbl">Tags · Marks</div><div class="tok">--r-1</div><div class="val">2px</div></div>
<div class="col"><div class="sw" style="border-radius:4px"></div><div class="lbl">Property Cards</div><div class="tok">--r-card</div><div class="val">4px</div></div>
<div class="col"><div class="sw" style="border-radius:6px"></div><div class="lbl">Modals</div><div class="tok">--r-3</div><div class="val">6px</div></div>
<div class="col"><div class="sw" style="border-radius:999px;width:120px;height:36px"></div><div class="lbl">Avatar &middot; Pill (rare)</div><div class="tok">--r-pill</div><div class="val">999px</div></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:#0a0a0a;color:#fff;font-family:var(--font-body);padding:28px 36px;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.row{display:flex;align-items:baseline;gap:24px;border-top:1px solid #2a2a2a;padding-top:14px}
.row:first-of-type{border:0;padding:0}
.lbl{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#9a9590;min-width:130px;flex-shrink:0}
.spec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5a5550;margin-left:auto}
.sample{flex:1;min-width:0}
</style></head><body>
<div class="row"><div class="lbl">Hero · Antonio 300</div><div class="sample" style="font-family:var(--font-display);font-weight:300;font-size:72px;line-height:.92;letter-spacing:.08em;text-transform:uppercase">A QUIETER LUXURY</div><div class="spec">72/.92/.08em</div></div>
<div class="row"><div class="lbl">Display · 200</div><div class="sample" style="font-family:var(--font-display);font-weight:200;font-size:54px;line-height:.92;letter-spacing:.14em;text-transform:uppercase">EDITORIAL HOMES</div><div class="spec">54/.92/.14em</div></div>
<div class="row"><div class="lbl">H2 · 300</div><div class="sample" style="font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.05;letter-spacing:.08em;text-transform:uppercase">FEATURED LISTINGS</div><div class="spec">36/1.05/.08em</div></div>
<div class="row"><div class="lbl">H3 · 400</div><div class="sample" style="font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.25;letter-spacing:.08em;text-transform:uppercase">WHITE-GLOVE CONCIERGE</div><div class="spec">24/1.25/.08em</div></div>
</body></html>

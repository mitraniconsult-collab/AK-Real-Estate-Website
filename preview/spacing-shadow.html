<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#ece7dd;padding:36px 32px;min-height:240px;display:flex;gap:28px;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.sw{width:120px;height:120px;background:#fff}
.tok{font-family:'JetBrains Mono',monospace;font-size:10px;color:#b0181c}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#4a4a48;text-align:center}
.val{font-family:'JetBrains Mono',monospace;font-size:9px;color:#8a8478;text-align:center;max-width:140px}
</style></head><body>
<div class="col"><div class="sw" style="box-shadow:none;border:1px solid rgba(0,0,0,.08)"></div><div class="lbl">No shadow<br>(Dark surfaces)</div><div class="tok">--sh-none</div></div>
<div class="col"><div class="sw" style="box-shadow:0 2px 6px rgba(0,0,0,0.6)"></div><div class="lbl">Press</div><div class="tok">--sh-press</div><div class="val">0 2px 6px rgba(0,0,0,.6)</div></div>
<div class="col"><div class="sw" style="box-shadow:0 18px 40px -16px rgba(20,18,14,0.22)"></div><div class="lbl">Card (light)</div><div class="tok">--sh-light</div><div class="val">0 18px 40px -16px</div></div>
<div class="col"><div class="sw" style="box-shadow:0 24px 60px -20px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.18)"></div><div class="lbl">Card (cinematic)</div><div class="tok">--sh-card</div><div class="val">0 24px 60px -20px</div></div>
</body></html>

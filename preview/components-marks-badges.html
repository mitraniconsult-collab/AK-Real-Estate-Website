<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;color:#f5f1ea;padding:28px 32px;min-height:240px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.lbl{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#9a9590;width:120px;flex-shrink:0}
.row{display:flex;align-items:center;gap:18px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#f5f1ea;font-weight:500}
.sq{width:8px;height:8px;background:#b0181c;display:inline-block}
.sq-sm{width:5px;height:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#b0181c;display:inline-block}
.line{height:1px;width:36px;background:#b0181c;display:inline-block}
.badge-r{background:#b0181c;color:#fff;font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:5px 10px}
.badge-o{border:1px solid #f5f1ea;color:#f5f1ea;font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:5px 10px}
.badge-d{background:rgba(255,255,255,.08);color:#f5f1ea;font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:5px 10px}
.num{font-family:'Antonio',sans-serif;font-weight:200;font-size:48px;color:#b0181c;letter-spacing:.04em}
.numl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#9a9590}
.spec{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a5550;margin-left:auto}
</style></head><body>
<div class="row"><div class="lbl">Eyebrow</div>
  <div class="eyebrow"><span class="sq"></span>A PRIVATE RESIDENCE</div>
  <div class="eyebrow"><span class="sq-sm sq"></span>§ 04 — CONCIERGE</div>
  <div class="spec">▪ 8×8 / 5×5</div>
</div>
<div class="row"><div class="lbl">Marks</div>
  <span class="sq"></span><span class="sq-sm sq"></span><span class="dot"></span>
  <span class="line"></span>
  <span style="color:#b0181c;font-size:18px;font-weight:300">↗</span>
  <span style="color:#b0181c;font-size:14px">›</span>
  <span style="color:#b0181c;font-size:14px">·</span>
  <div class="spec">filled square is the primary brand mark</div>
</div>
<div class="row"><div class="lbl">Badges</div>
  <span class="badge-r">NEW</span>
  <span class="badge-r">OFF-MARKET</span>
  <span class="badge-o">RESERVED</span>
  <span class="badge-d">RESTORED · 1924</span>
  <div class="spec">0 radius · 9/.20em</div>
</div>
<div class="row"><div class="lbl">Section numerals</div>
  <span class="num">01</span><span class="numl">EYEBROW LABEL</span>
  <span class="num">02</span><span class="numl">EYEBROW LABEL</span>
  <span class="num">03</span><span class="numl">EYEBROW LABEL</span>
  <div class="spec">Antonio 200, crimson</div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;padding:0;min-height:340px;display:flex}
.hero{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#241612 0%,#0a0606 100%),radial-gradient(ellipse at 60% 40%,#7a5a3a 0%,transparent 60%);background-blend-mode:screen}
.tex{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><line x1='0' y1='0' x2='0' y2='6' stroke='%23ffffff' stroke-width='.5' opacity='.07' transform='rotate(35)'/></svg>");pointer-events:none;mix-blend-mode:overlay;opacity:.6}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.30) 40%,rgba(0,0,0,.85) 100%)}
.content{position:absolute;inset:0;padding:28px 36px;display:flex;flex-direction:column}
.nav{display:flex;align-items:center}
.logo{font-family:'Antonio',sans-serif;font-weight:300;font-size:18px;letter-spacing:.18em;color:#f5f1ea;display:flex;align-items:center;gap:10px}
.logo .s{width:6px;height:6px;background:#b0181c}
.logo .l{font-size:11px;letter-spacing:.32em;color:#9a9590}
.links{margin-left:auto;display:flex;gap:24px;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#f5f1ea;font-weight:500}
.body{margin-top:auto;display:grid;grid-template-columns:120px 1fr;gap:32px;align-items:end}
.vlabel{font-size:9px;letter-spacing:.42em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);color:#9a9590;font-weight:500}
.headline{text-align:right}
.eyebrow{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#9a9590;font-weight:500;margin-bottom:14px;display:inline-flex;align-items:center;gap:8px}
.eyebrow .sq{width:5px;height:5px;background:#b0181c}
.h{font-family:'Antonio',sans-serif;font-weight:200;font-size:64px;line-height:.92;letter-spacing:.10em;text-transform:uppercase;color:#fff}
.h em{color:#b0181c;font-style:italic;font-weight:400}
.foot{display:flex;align-items:center;gap:18px;margin-top:18px;justify-content:flex-end}
.cta{background:#b0181c;color:#fff;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;padding:12px 20px}
.tert{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#fff;font-weight:500;border-bottom:1px solid #b0181c;padding-bottom:4px}
.ring{position:absolute;left:-80px;bottom:-80px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(245,241,234,.10)}
</style></head><body>
<div class="hero">
  <div class="tex"></div>
  <div class="scrim"></div>
  <div class="ring"></div>
  <div class="content">
    <div class="nav">
      <div class="logo"><span>AK</span><span class="s"></span><span class="l">REAL ESTATE</span></div>
      <div class="links"><span>LISTINGS</span><span>CONCIERGE</span><span>FOUNDER</span><span>CONTACT</span></div>
    </div>
    <div class="body">
      <div class="vlabel">§ 01 — A PRIVATE PORTFOLIO</div>
      <div class="headline">
        <div class="eyebrow"><span class="sq"></span>SINCE 2014 · LOS ANGELES</div>
        <div class="h">A QUIETER<br>KIND OF <em>luxury.</em></div>
        <div class="foot"><span class="tert">VIEW PORTFOLIO</span><span class="cta">REQUEST ACCESS</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>

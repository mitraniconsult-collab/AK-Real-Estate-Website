<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;padding:28px 32px;min-height:240px;display:flex;gap:20px;align-items:center;justify-content:center}
.box{display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#9a9590;font-weight:500}
.mono{width:120px;height:120px;display:flex;align-items:center;justify-content:center;position:relative}
.mono.dark{background:#0a0a0a;border:1px solid #2a2a2a}
.mono.light{background:#f5f1ea}
.mono.crimson{background:#b0181c}
.inner{display:flex;flex-direction:column;align-items:center;gap:8px}
.ak{font-family:'Antonio',sans-serif;font-weight:300;font-size:38px;letter-spacing:.12em}
.dark .ak{color:#f5f1ea}
.light .ak{color:#0a0a0a}
.crimson .ak{color:#fff}
.sq{width:7px;height:7px;background:#b0181c}
.light .sq{background:#0a0a0a}
.crimson .sq{background:#fff}
.ring{position:absolute;inset:8px;border:1px solid rgba(245,241,234,.16)}
.light .ring{border-color:rgba(0,0,0,.10)}
.crimson .ring{border-color:rgba(255,255,255,.22)}
.size{display:flex;align-items:flex-end;gap:10px}
.size .mono{}
</style></head><body>
<div class="box"><div class="mono dark"><div class="ring"></div><div class="inner"><span class="ak">AK</span><span class="sq"></span></div></div><div class="lbl">MONOGRAM · DARK</div></div>
<div class="box"><div class="mono light"><div class="ring"></div><div class="inner"><span class="ak">AK</span><span class="sq"></span></div></div><div class="lbl">MONOGRAM · LIGHT</div></div>
<div class="box"><div class="mono crimson"><div class="ring"></div><div class="inner"><span class="ak">AK</span><span class="sq"></span></div></div><div class="lbl">MONOGRAM · CRIMSON</div></div>
<div class="box">
  <div class="size">
    <div class="mono dark" style="width:24px;height:24px"><div class="ring" style="inset:2px"></div><div class="inner"><span class="ak" style="font-size:8px;letter-spacing:.04em">AK</span></div></div>
    <div class="mono dark" style="width:48px;height:48px"><div class="ring" style="inset:4px"></div><div class="inner" style="gap:3px"><span class="ak" style="font-size:14px;letter-spacing:.06em">AK</span><span class="sq" style="width:3px;height:3px"></span></div></div>
    <div class="mono dark" style="width:80px;height:80px"><div class="ring" style="inset:6px"></div><div class="inner" style="gap:5px"><span class="ak" style="font-size:24px">AK</span><span class="sq" style="width:5px;height:5px"></span></div></div>
  </div>
  <div class="lbl">FAVICON · APP · BADGE</div>
</div>
</body></html>

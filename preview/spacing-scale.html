<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;color:#f5f1ea;padding:28px 32px;min-height:200px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:flex-end;gap:16px}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.bar{background:#b0181c;height:24px;border-radius:0}
.tok{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#9a9590}
.val{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a5550}
.label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#f5f1ea;margin-bottom:6px}
</style></head><body>
<div>
  <div class="label">SPACING SCALE — 4PX BASE</div>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px"></div><div class="tok">s-1</div><div class="val">4</div></div>
    <div class="col"><div class="bar" style="width:8px"></div><div class="tok">s-2</div><div class="val">8</div></div>
    <div class="col"><div class="bar" style="width:12px"></div><div class="tok">s-3</div><div class="val">12</div></div>
    <div class="col"><div class="bar" style="width:16px"></div><div class="tok">s-4</div><div class="val">16</div></div>
    <div class="col"><div class="bar" style="width:24px"></div><div class="tok">s-5</div><div class="val">24</div></div>
    <div class="col"><div class="bar" style="width:32px"></div><div class="tok">s-6</div><div class="val">32</div></div>
    <div class="col"><div class="bar" style="width:48px"></div><div class="tok">s-7</div><div class="val">48</div></div>
    <div class="col"><div class="bar" style="width:64px"></div><div class="tok">s-8</div><div class="val">64</div></div>
    <div class="col"><div class="bar" style="width:96px"></div><div class="tok">s-9</div><div class="val">96</div></div>
    <div class="col"><div class="bar" style="width:128px"></div><div class="tok">s-10</div><div class="val">128</div></div>
  </div>
</div>
<div style="display:flex;gap:36px;border-top:1px solid #2a2a2a;padding-top:14px">
  <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a9590">SECTION RHYTHM &nbsp;<span style="font-family:'JetBrains Mono',monospace;color:#b0181c">clamp(80px, 10vw, 160px)</span></div>
  <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a9590">GUTTER &nbsp;<span style="font-family:'JetBrains Mono',monospace;color:#b0181c">clamp(24px, 4vw, 64px)</span></div>
</div>
</body></html>

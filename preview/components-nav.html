<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;color:#f5f1ea;padding:0;min-height:280px;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;padding:22px 36px;border-bottom:1px solid #2a2a2a;backdrop-filter:blur(18px);background:rgba(0,0,0,.55)}
.logo{display:flex;align-items:center;gap:10px}
.logo .a{font-family:'Antonio',sans-serif;font-weight:300;font-size:22px;letter-spacing:.18em}
.logo .s{width:8px;height:8px;background:#b0181c;display:inline-block}
.logo .b{font-family:'Antonio',sans-serif;font-weight:300;font-size:13px;letter-spacing:.32em;color:#9a9590}
.links{margin-left:auto;display:flex;gap:36px}
.links a{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#f5f1ea;text-decoration:none;font-weight:500}
.links a:hover{color:#b0181c}
.links a.active{color:#b0181c}
.cta{margin-left:36px;background:#b0181c;color:#fff;padding:10px 18px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.below{padding:32px 36px;display:flex;gap:32px;color:#5a5550;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.below .k{color:#9a9590}
</style></head><body>
<div class="nav">
  <div class="logo"><span class="a">AK</span><span class="s"></span><span class="b">REAL ESTATE</span></div>
  <div class="links">
    <a class="active" href="#">Listings</a>
    <a href="#">Concierge</a>
    <a href="#">The Founder</a>
    <a href="#">Journal</a>
    <a href="#">Press</a>
    <a href="#">Contact</a>
  </div>
  <div class="cta">REQUEST ACCESS</div>
</div>
<div class="below">
  <div><span class="k">BG</span> &nbsp; rgba(0,0,0,.55) + blur(18px)</div>
  <div><span class="k">LINK</span> &nbsp; 10/.28em &nbsp; 500</div>
  <div><span class="k">HOVER</span> &nbsp; → crimson</div>
  <div><span class="k">CTA</span> &nbsp; small red rectangle</div>
</div>
</body></html>

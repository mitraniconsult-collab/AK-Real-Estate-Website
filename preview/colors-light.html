<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#ece7dd;padding:24px;min-height:200px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.swatch{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#0a0a0a;font-size:10px;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(0,0,0,.04)}
.hex{font-size:9px;letter-spacing:.12em;color:#5a5550;margin-top:2px}
.swatch.invert{color:#f5f1ea}
.swatch.invert .hex{color:#c9c2b4}
</style></head><body>
<div class="grid">
  <div class="swatch" style="background:#ffffff">White<div class="hex">#FFFFFF</div></div>
  <div class="swatch" style="background:#f5f1ea">Bone<div class="hex">#F5F1EA</div></div>
  <div class="swatch" style="background:#ece7dd">Paper<div class="hex">#ECE7DD</div></div>
  <div class="swatch" style="background:#c9c2b4">Stone<div class="hex">#C9C2B4</div></div>
  <div class="swatch invert" style="background:#8a8478">Fog<div class="hex">#8A8478</div></div>
  <div class="swatch invert" style="background:#4a4a48">Pewter<div class="hex">#4A4A48</div></div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;font-family:'Inter',system-ui,sans-serif}body{background:#0a0a0a;color:#f5f1ea;padding:32px;min-height:200px;display:flex;flex-direction:column;gap:24px}
.lbl{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#9a9590}
.row{display:flex;gap:0}
.sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#f5f1ea;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.hex{font-size:9px;color:rgba(245,241,234,.65);margin-top:2px;letter-spacing:.1em}
.usage{display:flex;align-items:center;gap:18px}
.btn{background:#b0181c;color:#fff;padding:12px 22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.btn:hover{background:#7a0f12}
.line{height:1px;flex:1;background:linear-gradient(to right,#b0181c,transparent)}
.dot{width:8px;height:8px;background:#b0181c;display:inline-block}
.mark-text{font-family:'Antonio',sans-serif;font-weight:300;font-size:32px;letter-spacing:.1em;text-transform:uppercase}
.mark-text em{color:#b0181c;font-style:italic;font-weight:400}
</style></head><body>
<div>
  <div class="lbl" style="margin-bottom:10px">▪ Accent — Crimson</div>
  <div class="row">
    <div class="sw" style="background:#4a0608">Blood<div class="hex">#4A0608</div></div>
    <div class="sw" style="background:#7a0f12">Deep<div class="hex">#7A0F12</div></div>
    <div class="sw" style="background:#b0181c">Crimson<div class="hex">#B0181C · ACCENT</div></div>
    <div class="sw" style="background:#d12028">Bright<div class="hex">#D12028</div></div>
  </div>
</div>
<div class="usage">
  <span class="dot"></span>
  <div class="line"></div>
  <span class="mark-text">A LOUDER <em>house.</em></span>
  <div class="btn">VIEW</div>
</div>
</body></html>

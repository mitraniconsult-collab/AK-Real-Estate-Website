<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0}body{background:#0a0a0a;color:#fff;font-family:var(--font-body);padding:32px;min-height:300px;display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:center}
.left{display:flex;align-items:center;justify-content:center;border-left:1px solid #b0181c;padding-left:32px}
.vlabel{font-size:11px;letter-spacing:.42em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);color:#9a9590;font-weight:500}
.right{display:flex;flex-direction:column;gap:18px}
.headline{font-family:var(--font-display);font-weight:200;font-size:52px;line-height:.95;letter-spacing:.1em;text-transform:uppercase}
.mark{color:#b0181c;font-style:italic;font-weight:400}
.notes{display:flex;gap:24px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#5a5550;border-top:1px solid #2a2a2a;padding-top:12px}
.notes span:first-child{color:#9a9590}
</style></head><body>
<div class="left"><div class="vlabel">§ 04 — Editorial</div></div>
<div class="right">
  <div style="display:flex;align-items:center;gap:14px"><span style="display:inline-block;width:8px;height:8px;background:#b0181c"></span><span style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#9a9590">A SINGULAR ADDRESS</span></div>
  <div class="headline">THE QUIETER<br>THE STREET, THE<br>LOUDER THE <span class="mark">house.</span></div>
  <div class="notes"><span>VERTICAL LABEL · .42em</span><span>RED-MARK WORD · italic 400</span><span>EYEBROW · ▪ + .28em</span></div>
</div>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AK Real Estate — Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Resolves all relative admin assets (JSX scripts) against /admin/ regardless of the
     clean URL depth (e.g. /admin/listings/new), so Vercel's rewrite to /admin/index.html
     loads them correctly. Absolute paths (/admin/..., /assets/...) ignore this base. -->
<base href="/admin/">
<link rel="icon" href="/assets/logo-monogram.svg">
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ak-ink);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--ak-crimson); color: #fff; }

  /* Reset autofill */
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus,
  textarea:-webkit-autofill, select:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
    -webkit-text-fill-color: var(--fg) !important;
    transition: background-color 5000s ease-in-out 0s;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ak-iron); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ak-crimson); }

  @keyframes ak-rise { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: none; } }
  .ak-rise { animation: ak-rise .5s cubic-bezier(0.2, 0.6, 0.2, 1) forwards; }

  /* ── Mobile responsive ── */
  @media (max-width: 640px) {

    /* LoginPage: collapse 2-col cinematic layout to single column.
       [style*="1.2fr 1fr"] is unique to LoginPage's root grid in this app. */
    [style*="1.2fr 1fr"] {
      grid-template-columns: 1fr !important;
    }

    /* Hide the decorative left image panel — form becomes full-width. */
    [style*="1.2fr 1fr"] > div:first-child {
      display: none !important;
    }
  }

  /* ── Dashboard: stack Latest Listings + Recent Activity at tablet width ── */
  @media (max-width: 980px) {
    /* "minmax(0, 1.4fr) minmax(0, 1fr)" is unique to the dashboard bottom grid */
    [style*="1.4fr) minmax(0, 1fr)"] {
      grid-template-columns: 1fr !important;
    }
  }

  /* ── Phone ── */
  @media (max-width: 640px) {

    /* DashboardPage LatestRow: 5-col → 3-col; hide price (child 3) + arrow (child 5) */
    [style*="64px 1fr auto auto auto"] {
      grid-template-columns: 56px 1fr auto !important;
    }
    [style*="64px 1fr auto auto auto"] > span:nth-child(3),
    [style*="64px 1fr auto auto auto"] > span:nth-child(5) {
      display: none !important;
    }

    /* ListingsPage filter bar search: remove hard min-width so it wraps cleanly */
    [style*="min-width: 220px"] {
      min-width: 0 !important;
      flex: 1 1 auto !important;
    }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  window.AK_SUPABASE_URL = "https://ylyilqwoiyirodigshgd.supabase.co";
  window.AK_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wxCfqS0aCFRRXf0WgIhGzw_2SGd8tcL";

  window.akSupabase = window.supabase.createClient(
    window.AK_SUPABASE_URL,
    window.AK_SUPABASE_PUBLISHABLE_KEY
  );
</script>

  <script src="/shared/listings-store.js"></script>

  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="store.jsx"></script>
  <script type="text/babel" src="AdminShell.jsx"></script>
  <script type="text/babel" src="LoginPage.jsx"></script>
  <script type="text/babel" src="DashboardPage.jsx"></script>
  <script type="text/babel" src="ListingsPage.jsx"></script>
  <script type="text/babel" src="ListingFormPage.jsx"></script>
  <script type="text/babel" src="InquiriesPage.jsx"></script>

  <script type="text/babel">
    const { AdminShell, LoginPage, DashboardPage, ListingsPage, ListingFormPage, InquiriesPage, useRoute, useAuth } = window;

    function App() {
      const route = useRoute();
      const auth = useAuth();

if (auth.checkingAuth) {
  return (
    <div style={{
      minHeight: '100vh',
      display: 'grid',
      placeItems: 'center',
      background: 'var(--ak-black)',
      color: 'var(--fg)',
      fontFamily: 'var(--font-body)',
      letterSpacing: '0.22em',
      textTransform: 'uppercase',
      fontSize: 11
    }}>
      Checking access…
    </div>
  );
}

if (!auth.signedIn) {
  return <LoginPage onSubmit={auth.signIn} />;
}

      let page;
      if (route.name === 'dashboard') page = <DashboardPage />;
      else if (route.name === 'inquiries') page = <InquiriesPage />;
      else if (route.name === 'listings') page = <ListingsPage />;
      else if (route.name === 'listing-new') page = <ListingFormPage mode="new" />;
      else if (route.name === 'listing-edit') page = <ListingFormPage mode="edit" id={route.id} />;
      else page = <DashboardPage />;

      return (
        <AdminShell active={route.name} onSignOut={auth.signOut}>
          {page}
        </AdminShell>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

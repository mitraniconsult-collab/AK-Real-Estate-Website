<script type="text/babel" src="Services.jsx"></script>

<script type="text/babel">
  const { AkLangProvider, Nav, Hero, Listings, Founder, Concierge, Editorial, Press, AppPromo, Journal, Contact, Footer, ServicesPage } = window;

  // tiny hash router — '#/services' → services page; everything else → home
  function readRoute() {
    const h = (window.location.hash || '').replace(/^#\/?/, '').toLowerCase();
    if (h === 'services') return 'services';
    if (h === 'contact')  return 'contact';
    return 'home';
  }

  function App() {
    const [route, setRoute] = React.useState(readRoute());

    React.useEffect(() => {
      const fn = () => setRoute(readRoute());
      window.addEventListener('hashchange', fn);
      return () => window.removeEventListener('hashchange', fn);
    }, []);

    // scroll to top when route changes
    React.useEffect(() => { window.scrollTo({ top: 0, behavior: 'auto' }); }, [route]);

    const onNav = (id) => {
      if (id === 'services') { window.location.hash = '#/services'; return; }
      if (id === 'contact') {
        if (route !== 'home') { window.location.hash = '#/'; }
        // scroll to contact section once home is rendered
        setTimeout(() => {
          const el = document.getElementById('contact');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
        return;
      }
      // listings / home
      window.location.hash = '#/';
    };

    const active = route === 'services' ? 'services'
                 : route === 'contact'  ? 'contact'
                 : 'listings';

    return (
      <>
        <Nav active={active} onNav={onNav} />
        {route === 'services' ? (
          <main><ServicesPage onNav={onNav} /></main>
        ) : (
          <main>
            <Hero />
            <Listings />
            <Founder />
            <Concierge />
            <Editorial />
            <Press />
            <AppPromo />
            <Journal />
            <div id="contact"><Contact /></div>
          </main>
        )}
        <Footer />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <AkLangProvider><App /></AkLangProvider>
  );
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AK Real Estate — A Quieter Kind of Luxury</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../assets/logo-monogram.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ak-ink);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--ak-crimson); color: #fff; }
  .ak-section { padding: var(--section-y) var(--gutter); position: relative; }
  .ak-section.dark { background: var(--ak-ink); color: var(--fg); }
  .ak-section.black { background: var(--ak-black); color: var(--fg); }
  .ak-section.light { background: var(--ak-bone); color: var(--fg-on-light); }
  .ak-grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><line x1='0' y1='0' x2='0' y2='6' stroke='%23ffffff' stroke-width='.5' opacity='.08' transform='rotate(35)'/></svg>");
    mix-blend-mode: overlay; opacity: .5;
  }
  /* Fades on enter */
  @keyframes ak-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .ak-rise { animation: ak-rise .9s var(--ease) both; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="../../shared/listings-store.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Listings.jsx"></script>
  <script type="text/babel" src="Founder.jsx"></script>
  <script type="text/babel" src="Concierge.jsx"></script>
  <script type="text/babel" src="Editorial.jsx"></script>
  <script type="text/babel" src="Press.jsx"></script>
  <script type="text/babel" src="AppPromo.jsx"></script>
  <script type="text/babel" src="Journal.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const { Nav, Hero, Listings, Founder, Concierge, Editorial, Press, AppPromo, Journal, Contact, Footer } = window;
    function App() {
      const [active, setActive] = React.useState('listings');
      return (
        <>
          <Nav active={active} onNav={setActive} />
          <main>
            <Hero />
            <Listings />
            <Founder />
            <Concierge />
            <Editorial />
            <Press />
            <AppPromo />
            <Journal />
            <Contact />
          </main>
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

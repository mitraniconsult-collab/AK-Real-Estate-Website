<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AK Real Estate — A Quieter Kind of Luxury</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../assets/logo-monogram.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ak-ink);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--ak-crimson); color: #fff; }
  .ak-section { padding: var(--section-y) var(--gutter); position: relative; }
  .ak-section.dark { background: var(--ak-ink); color: var(--fg); }
  .ak-section.black { background: var(--ak-black); color: var(--fg); }
  .ak-section.light { background: var(--ak-bone); color: var(--fg-on-light); }
  .ak-grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><line x1='0' y1='0' x2='0' y2='6' stroke='%23ffffff' stroke-width='.5' opacity='.08' transform='rotate(35)'/></svg>");
    mix-blend-mode: overlay; opacity: .5;
  }
  /* Fades on enter */
  @keyframes ak-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .ak-rise { animation: ak-rise .9s var(--ease) both; }

  /* =====================================================================
     RESPONSIVE LAYER
     The components use inline styles for layout. Mobile overrides below
     use !important to flip multi-column grids to single column, hide
     decorative edge labels that don't fit, soften vertical rhythm, and
     wrap dense flex strips. Two breakpoints:
       <= 980px  tablet  (2-col → 1-col where appropriate)
       <= 640px  phone   (everything stacks, smaller margins/type)
     ===================================================================== */

  /* Tablet */
  @media (max-width: 980px) {
    :root {
      --gutter: clamp(20px, 4vw, 40px);
      --section-y: clamp(64px, 9vw, 110px);
    }
    .r-stack-980 { grid-template-columns: 1fr !important; }
    .r-stack-980-keep-label { grid-template-columns: minmax(28px,auto) 1fr !important; }
    .r-masonry { grid-template-columns: repeat(6, 1fr) !important; grid-auto-rows: 140px !important; }
    .r-overflow-2 { grid-template-columns: repeat(2, 1fr) !important; }
    .r-journal { grid-template-columns: repeat(2, 1fr) !important; }
  }

  /* Phone */
  @media (max-width: 640px) {
    :root {
      --gutter: 20px;
      --section-y: clamp(56px, 12vw, 80px);
    }

    /* Stack any multi-column container tagged for collapse */
    .r-stack-640,
    .r-stack-980,
    .r-cols-2,
    .r-cols-3,
    .r-cols-4 {
      grid-template-columns: 1fr !important;
    }
    .r-cols-6 { grid-template-columns: repeat(3, 1fr) !important; }
    .r-stack-640-keep-label { grid-template-columns: minmax(20px,auto) 1fr !important; }

    /* Tighten gaps when stacked */
    .r-stack-640, .r-stack-980, .r-cols-2, .r-cols-3, .r-cols-4 {
      gap: clamp(24px, 6vw, 40px) !important;
    }

    /* Masonry: every card spans full width, fixed-ish height */
    .r-masonry {
      grid-template-columns: 1fr !important;
      grid-auto-rows: auto !important;
      gap: 16px !important;
    }
    .r-masonry > a {
      grid-column: 1 / -1 !important;
      grid-row: auto !important;
      aspect-ratio: 4 / 5 !important;
      min-height: 0 !important;
    }

    /* Overflow grid → 1-col */
    .r-overflow-2, .r-journal { grid-template-columns: 1fr !important; }

    /* Decorative vertical edge labels hidden on phone — they have no room */
    .r-edge-label { display: none !important; }

    /* Flex strips that get cramped: allow wrapping and softer alignment */
    .r-flex-wrap { flex-wrap: wrap !important; }
    .r-hide-phone { display: none !important; }
    .r-shrink { flex: 1 1 100% !important; }

    /* Footer wordmark row */
    .r-footer-head { flex-wrap: wrap !important; gap: 16px !important; }
    .r-footer-head > span:nth-of-type(1) { display: none !important; } /* mid hairline */
    .r-legal { flex-wrap: wrap !important; row-gap: 8px !important; column-gap: 14px !important; font-size: 9px !important; }
    .r-legal > .r-spacer { display: none !important; }

    /* Editorial inset double-column copy → single */
    .r-edit-inset-copy { grid-template-columns: 1fr !important; }

    /* Concierge service tiles → 1-col */
    .r-services { grid-template-columns: 1fr !important; }

    /* App promo phone mock — scale down */
    .r-app-phone { transform: scale(.86); transform-origin: center; }

    /* Contact line stack */
    .r-contact-line { grid-template-columns: 1fr !important; gap: 4px !important; }

    /* Press headline strip */
    .r-press-head { flex-wrap: wrap !important; gap: 14px !important; }

    /* Hero bottom strip */
    .r-hero-strip {
      flex-wrap: wrap !important; gap: 10px !important; row-gap: 6px !important;
      font-size: 9px !important;
    }
    .r-hero-strip > span:nth-of-type(3) { display: none !important; } /* mid hairline */

    /* Listings header CTA row */
    .r-listings-foot { gap: 16px !important; }
    .r-listings-foot > span:nth-of-type(2) { display: none !important; }

    /* Lower display-headline letterspacing for small widths so words fit */
    h1, h2 { letter-spacing: 0.04em !important; }

    /* Re-align "right-aligned" hero block to left on phone */
    .r-text-left-mobile { text-align: left !important; justify-self: start !important; }
    .r-text-left-mobile p { margin-left: 0 !important; }
    .r-text-left-mobile > div:last-of-type { justify-content: flex-start !important; }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#0a0a0a">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0a0a0a"></rect>
      <rect x="180" y="160" width="840" height="480" fill="none" stroke="#f5f1ea" stroke-width="1.5" opacity="0.4"></rect>
      <g fill="#f5f1ea" font-family="Georgia, serif" font-weight="300" letter-spacing="20" text-anchor="middle">
        <text x="600" y="420" font-size="120">AK</text>
      </g>
      <rect x="585" y="470" width="30" height="30" fill="#b0181c"></rect>
      <g fill="#9a9590" font-family="Georgia, serif" font-weight="300" letter-spacing="14" text-anchor="middle">
        <text x="600" y="560" font-size="22">REAL ESTATE</text>
      </g>
    </svg>

  <div id="root"></div>

  <script src="../../shared/listings-store.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Listings.jsx"></script>
  <script type="text/babel" src="Founder.jsx"></script>
  <script type="text/babel" src="Concierge.jsx"></script>
  <script type="text/babel" src="Editorial.jsx"></script>
  <script type="text/babel" src="Press.jsx"></script>
  <script type="text/babel" src="AppPromo.jsx"></script>
  <script type="text/babel" src="Journal.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const { Nav, Hero, Listings, Founder, Concierge, Editorial, Press, AppPromo, Journal, Contact, Footer } = window;
    function App() {
      const [active, setActive] = React.useState('listings');
      return (
        <>
          <Nav active={active} onNav={setActive} />
          <main>
            <Hero />
            <Listings />
            <Founder />
            <Concierge />
            <Editorial />
            <Press />
            <AppPromo />
            <Journal />
            <Contact />
          </main>
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
